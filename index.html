<!DOCTYPE html>
<html>
<head>
  <title>PS5 FIFA Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body {
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #3a1c00, #000);
  color: white;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 16px;
}

.card {
  background: linear-gradient(180deg,#1a1a1a,#000);
  border: 1px solid #ffb300;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 0 25px #ff990055;
  animation: glow 3s infinite alternate;
}

@keyframes glow {
  from { box-shadow:0 0 10px #ff990033; }
  to { box-shadow:0 0 30px #ff9900aa; }
}

h1 {
  text-align:center;
  color:#ffcc33;
  font-size:22px;
  margin-bottom:6px;
}

.sub {
  text-align:center;
  color:#ffa726;
  margin-bottom:16px;
  font-size:14px;
}

/* compact inputs */

input {
  width:90%;
  padding:10px 12px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ffb30055;
  font-size:14px;
  background:#0b0b0b;
  color:#fff;
  outline:none;
}

input::placeholder {
  color:#ffaa33aa;
}

input:focus {
  border-color:#ffb300;
  box-shadow:0 0 10px #ffb30066;
}

/* qr */

.qr-box {
  text-align:center;
  margin:16px 0;
  animation: float 3s ease-in-out infinite;
  font-size:14px;
}

@keyframes float {
  50%{transform:translateY(-6px)}
}

.qr-box img {
  width:180px;
  border-radius:12px;
  border:3px solid #ffb300;
}

/* upload */

.upload {
  background:#111;
  padding:10px;
  border-radius:8px;
  border:1px dashed #ffb300;
  font-size:13px;
  margin-bottom:14px;
}

/* button */

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background: linear-gradient(90deg,#ff9800,#ffcc33);
  color:black;
}

button:hover {
  transform:scale(1.04);
  box-shadow:0 0 20px #ffb300;
}

.note {
  text-align:center;
  font-size:12px;
  color:#ffb74d;
  margin-top:8px;
}

/* popup */

.popup {
  position:fixed;
  inset:0;
  background:#000000cc;
  display:none;
  align-items:center;
  justify-content:center;
}

.popup.show { display:flex }

.popup-card {
  background:#111;
  border:1px solid #ffb300;
  border-radius:14px;
  padding:24px;
  text-align:center;
  color:#ffcc33;
  animation: pop .3s ease;
}

@keyframes pop {
  from {transform:scale(.7); opacity:0}
  to {transform:scale(1); opacity:1}
}

.popup-card button {
  margin-top:14px;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>PS5 FIFA TOURNAMENT</h1>
<div class="sub">March 15 Registration</div>

<input id="name" placeholder="Player Name">
<input id="phone" placeholder="Phone Number">

<div class="qr-box">
  <div>Scan & Pay ₹350</div>
  <img src="assets/qr.jpg">
</div>

<div class="upload">
  Upload Payment Proof
  <input type="file" id="proof">
</div>

<button id="regBtn">REGISTER NOW</button>
<div class="note">Limited slots • Entry after verification</div>

</div>
</div>

<!-- success popup -->

<div id="successPopup" class="popup">
  <div class="popup-card">
    ✅ Registration Submitted
    <div style="font-size:13px;margin-top:8px;">
      Proof uploaded successfully
    </div>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>

/* 🔒 keep your key private — fill locally only */
const SUPABASE_URL = "https://waiawcfisyswzztialqb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhaWF3Y2Zpc3lzd3p6dGlhbHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3NDcyNTUsImV4cCI6MjA4NTMyMzI1NX0.N5lWVziuEryRWmPEZWpjNXUggYRjD9GtLEqxPI2Pk2o";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("regBtn").onclick = register;

async function register(){

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const file = document.getElementById("proof").files[0];

  if(!name || !phone || !file){
    alert("Fill all fields");
    return;
  }

  const fileName = Date.now()+"_"+file.name;

  const { error } = await client.storage
    .from("payment-proofs")
    .upload(fileName, file);

  if(error){
    alert(error.message);
    return;
  }

  const { data } = client.storage
    .from("payment-proofs")
    .getPublicUrl(fileName);

  await client.from("tournament_registrations").insert({
    name,
    phone,
    payment_proof_url:data.publicUrl
  });

  showPopup();
}

function showPopup(){
  document.getElementById("successPopup").classList.add("show");
}

function closePopup(){
  document.getElementById("successPopup").classList.remove("show");
}

</script>

</body>
</html>
